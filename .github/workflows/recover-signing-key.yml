name: Recover ZaStoGram signing backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create encrypted signing backup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RECOVERY_PASSWORD: ${{ secrets.ZASTOGRAM_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$RECOVERY_PASSWORD" ]; then
            echo "::error::Required signing recovery secret is missing"
            exit 1
          fi

          umask 077
          mkdir signing-backup
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing-backup/release.keystore
          printf '%s' "$KEYSTORE_PASSWORD" > signing-backup/store-password.txt
          printf '%s' "$KEYSTORE_PASSWORD" > signing-backup/key-password.txt
          printf '%s' 'zastogram' > signing-backup/key-alias.txt
          tar -C signing-backup -cf signing-backup.tar .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in signing-backup.tar \
            -out zastogram-signing-backup.enc \
            -pass env:RECOVERY_PASSWORD
          rm -rf signing-backup signing-backup.tar

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: zastogram-signing-recovery-encrypted
          path: zastogram-signing-backup.enc
          if-no-files-found: error
          retention-days: 1
